name: Release Packaging

# Builds the two Linux distributables Phase 1 (kelpie.md §135, §123) requires:
# a .deb and an AppImage. Deliberately not run on every PR — packaging builds
# are slower than plain compile/test CI and only matter for tagged releases
# or on-demand checks, so this is triggered manually or by pushing a `v*` tag.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  bundle-linux:
    name: Build .deb + AppImage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Tauri Linux build deps)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> apps/desktop/src-tauri/target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build .deb and AppImage
        run: npm run tauri build
        working-directory: apps/desktop

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: kelpie-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: kelpie-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
