[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/core",
    "crates/database",
    "crates/providers",
    "crates/feed",
    "crates/search",
    "crates/media",
    "crates/browser",
    "crates/downloads",
    "crates/security",
    "crates/networking",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
thiserror = "1"
directories = "5"
